query CartDeliveryOptionsTransformRunInput {
  cart {
    deliveryGroups {
      deliveryAddress {
        address1
        provinceCode
      }
      cartLines {
        merchandise {
          ... on ProductVariant {
            product {
              hasDangerousGoodsTag: hasAnyTag(tags: ["Dangerous Goods"])
            }
          }
        }
      }
      deliveryOptions {
        handle
        title
        code
      }
    }
  }
}
